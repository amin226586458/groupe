<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة إلى واتساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">

        <!-- الشريط العلوي -->
        <header class="topbar">
            <button class="menu-btn" aria-label="القائمة">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="whatsapp-logo">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M24 4a20 20 0 0 0-17.3 30L4 44l10.3-2.7A20 20 0 1 0 24 4Z"
                          fill="none" stroke="currentColor" stroke-width="3.5"/>
                    <path d="M17.5 14.5c-.6 0-1.2.3-1.5.9-.5 1-.9 2.4-.3 4.1 1.1 3.1 5.2 7.2 8.3 8.3 1.7.6 3.1.2 4.1-.3.6-.3.9-.9.9-1.5v-1.2c0-.4-.2-.7-.6-.9l-2.8-1.3c-.4-.2-.8-.1-1.1.3l-1.1 1.3c-1.7-.8-3.1-2.2-3.9-3.9l1.3-1.1c.3-.3.4-.7.3-1.1l-1.3-2.8c-.2-.4-.5-.6-.9-.6h-1.4Z"
                          fill="currentColor"/>
                </svg>
                <span>WhatsApp</span>
            </div>

            <button class="download-top" id="downloadTop" aria-label="تنزيل">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"
                          fill="none" stroke="currentColor"
                          stroke-width="2.2" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </button>
        </header>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">

            <div class="illustration">
                <svg viewBox="0 0 240 240">
                    <circle cx="120" cy="120" r="112" fill="#f3f8f5"/>
                    <path d="M76 88h88c10 0 18 8 18 18v42c0 10-8 18-18 18h-58l-19 15v-15h-11c-10 0-18-8-18-18v-42c0-10 8-18 18-18Z"
                          fill="#82d5f5"/>
                    <circle cx="105" cy="127" r="5" fill="white"/>
                    <circle cx="120" cy="127" r="5" fill="white"/>
                    <circle cx="135" cy="127" r="5" fill="white"/>
                </svg>
            </div>

            <h1>دعوة إلى واتساب</h1>

            <button class="join-btn" id="joinBtn">
                الانضمام إلى الدردشة
            </button>

            <div class="separator"></div>

            <p class="question">أليس لديك تطبيق واتساب بعد؟</p>

            <button class="download-link" id="downloadLink">
                تنزيل
            </button>

        </main>

        <!-- التذييل -->
        <footer class="footer">

            <button class="download-footer" id="downloadFooter">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"
                          fill="none" stroke="currentColor"
                          stroke-width="2.2" stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                <span>تنزيل</span>
            </button>

            <div class="social-links">
                <a href="#" aria-label="Threads">
                    <span class="threads-icon">◎</span>
                </a>
                <a href="#" aria-label="Facebook">
                    <span class="facebook-icon">f</span>
                </a>
                <a href="#" aria-label="Instagram">
                    <span class="instagram-icon">◎</span>
                </a>
                <a href="#" aria-label="YouTube">
                    <span class="youtube-icon">▶</span>
                </a>
                <a href="#" aria-label="X">
                    <span class="x-icon">𝕏</span>
                </a>
            </div>

        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
