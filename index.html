<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة إلى واتساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">

        <!-- الشريط العلوي -->
        <header class="topbar">

            <button class="menu-btn" aria-label="القائمة">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- شعار واتساب -->
            <div class="whatsapp-logo">
                <svg class="whatsapp-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <path
                        fill="currentColor"
                        d="M16 3.2A12.8 12.8 0 0 0 5 22.5L3.2 28.8l6.5-1.7A12.8 12.8 0 1 0 16 3.2Zm0 23.2a10.3 10.3 0 0 1-5.2-1.4l-.4-.2-3.8 1 1-3.7-.2-.4A10.3 10.3 0 1 1 16 26.4Zm5.7-7.7c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.4 8.4 0 0 1-2.5-1.5 9.3 9.3 0 0 1-1.7-2.1c-.2-.4 0-.6.2-.8l.5-.6c.2-.2.2-.4.3-.6s0-.4 0-.5-.7-1.7-1-2.3c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.4 1 2.8 1.1 3c.1.2 2 3.1 4.8 4.3.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4s-.3-.2-.6-.4Z"
                    />
                </svg>
                <span>WhatsApp</span>
            </div>

            <button class="download-top" id="downloadTop" aria-label="تنزيل">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
            </button>

        </header>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">

            <div class="illustration">
                <svg viewBox="0 0 240 240" aria-hidden="true">
                    <circle cx="120" cy="120" r="112" fill="#f3f8f5"/>

                    <path
                        d="M76 88h88c10 0 18 8 18 18v42c0 10-8 18-18 18h-58l-19 15v-15h-11c-10 0-18-8-18-18v-42c0-10 8-18 18-18Z"
                        fill="#82d5f5"
                    />

                    <circle cx="105" cy="127" r="5" fill="white"/>
                    <circle cx="120" cy="127" r="5" fill="white"/>
                    <circle cx="135" cy="127" r="5" fill="white"/>
                </svg>
            </div>

            <h1>دعوة إلى واتساب</h1>

            <button class="join-btn" id="joinBtn">
                الانضمام إلى الدردشة
            </button>

            <div class="separator"></div>

            <p class="question">أليس لديك تطبيق واتساب بعد؟</p>

            <button class="download-link" id="downloadLink">
                تنزيل
            </button>

        </main>

        <!-- التذييل -->
        <footer class="footer">

            <button class="download-footer" id="downloadFooter">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.2"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>
                </svg>
                <span>تنزيل</span>
            </button>

            <div class="social-links">

                <a href="#" aria-label="Threads">
                    <span class="threads-icon">◎</span>
                </a>

                <a href="#" aria-label="Facebook">
                    <span class="facebook-icon">f</span>
                </a>

                <a href="#" aria-label="Instagram">
                    <span class="instagram-icon">
                        <span class="instagram-dot"></span>
                    </span>
                </a>

                <a href="#" aria-label="YouTube">
                    <span class="youtube-icon">▶</span>
                </a>

                <a href="#" aria-label="X">
                    <span class="x-icon">𝕏</span>
                </a>

            </div>

        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
